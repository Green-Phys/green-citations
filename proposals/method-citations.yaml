components:
  green-mbpt:
    methods:
      hartree-fock:
        status: resolved
        proposed: []
        rationale: >-
          No method-specific paper is required for standalone or embedded
          Hartree-Fock. The general GREEN software citation still applies.
        questions: []

      gf2:
        status: review-required
        proposed:
          - publication: gf2-foundation-2014
            role: original-method
            when: any GF2 calculation
          - publication: gf2-periodic-2016
            role: specialized-method
            when: periodic GF2 calculations
          - publication: gf2-periodic-bandgaps-2019
            role: application-and-validation
            when: periodic GF2 band gaps or propagator-renormalization results are central
          - publication: gf2-two-particle-properties-2021
            role: observable-method
            when: GF2 two-particle properties derived by this route are reported
        rationale: >-
          Phillips and Zgid establish the molecular formulation; Rusakov and
          Zgid establish periodic GF2. The two Iskakov-involving papers address
          periodic band-gap physics and two-particle observables rather than
          replacing those core method papers. GREEN's general software citation
          is governed separately.
        questions:
          - Should periodic calculations cite both the 2014 and 2016 method papers, or only 2016?
          - Should either Iskakov-involving paper be required more broadly than the matching result or observable?
          - Is the 2024 tensor-hypercontraction/GWSOX paper relevant only when those features are used?

      gw:
        status: resolved
        proposed:
          - publication: gw-original-1965
            role: original-method
            when: any GW calculation
          - publication: gw-green-periodic-2022
            role: specialized-method
            when: nonrelativistic periodic finite-temperature GW
        rationale: >-
          The GREEN theory page explicitly identifies Hedin as the original GW
          method and the 2022 paper as the implemented finite-temperature,
          Gaussian-Bloch-orbital formulation. Both apply to molecular and solid
          GREEN calculations; the general GREEN software citation is additional.
        questions: []

      relativistic-gw-x2c:
        status: resolved
        proposed:
          - publication: gw-original-1965
            role: original-method
            when: any relativistic GW calculation
          - publication: gw-relativistic-x2c-2022
            role: specialized-method
            when: X2C or spin-orbit GW is enabled
        rationale: >-
          Every GREEN relativistic calculation uses X2C. The relativistic X2C
          paper is also the implementation paper for this route; the general
          GREEN software citation applies separately.
        questions: []

      seet:
        status: review-required
        proposed:
          - publication: seet-framework-2017
            role: original-framework
            when: any SEET or fully self-consistent SEET calculation
          - publication: seet-gw-2017
            role: specialized-method
            when: GW is the weak-coupling method
          - publication: green-weakcoupling-1.0-2027
            role: green-implementation
            when: GREEN supplies the weak-coupling or embedding workflow
        rationale: >-
          The code exposes SEET and FSC_SEET with GF2 or GW weak solvers. The
          website cites the general finite-temperature framework and a SEET+GW
          application, but no explicit SEET+GF2 mapping.
        questions:
          - Which publication should be required for SEET+GF2?
          - Does the exact-diagonalization impurity solver have its own required citation?
          - Should FSC_SEET carry a distinct citation from inner-loop SEET?

      diis:
        status: review-required
        proposed:
          - publication: diis-original-1980
            role: original-method
            when: DIIS is selected
          - publication: diis-improved-1982
            role: method-development
            when: the implemented variant relies on the improved formulation
          - publication: dyson-subspace-2022
            role: specialized-method
            when: finite-temperature Dyson DIIS or CDIIS is selected
        rationale: >-
          GREEN exposes DIIS and commutator DIIS. The theory page cites both
          Pulay papers and the finite-temperature Dyson study, but does not say
          which citation belongs to each command-line choice.
        questions:
          - Which Pulay paper corresponds to GREEN's DIIS implementation?
          - Should CDIIS cite only the 2022 Dyson paper, or Pulay plus that paper?

      chebyshev-grid:
        status: resolved
        proposed:
          - publication: chebyshev-imaginary-time-2018
            role: numerical-method
            when: the Chebyshev representation is selected
        rationale: >-
          Chebyshev is supported throughout all GREEN releases and this paper is
          a secondary citation whenever the representation is selected.
        questions: []

      intermediate-representation-grid:
        status: resolved
        proposed:
          - publication: ir-original-2017
            role: original-method
            when: the intermediate representation is selected
          - publication: sparse-sampling-2020
            role: numerical-method
            when: GREEN's sparse time/frequency sampling is used
        rationale: >-
          IR is supported throughout all GREEN releases. The IR and sparse-
          sampling papers are secondary citations whenever this representation
          is selected.
        questions: []

  green-ac:
    methods:
      nevanlinna:
        status: review-required
        proposed:
          - publication: nevanlinna-2021
            role: original-method
            when: scalar Nevanlinna continuation is used
        rationale: The installation and theory pages identify this method in green-ac.
        questions:
          - Is there a separate GREEN green-ac implementation paper or software citation?

      caratheodory:
        status: resolved
        proposed:
          - publication: caratheodory-2021
            role: original-method
            when: matrix-valued Caratheodory continuation is used
        rationale: >-
          Caratheodory is user-accessible in green-ac, but is not a recommended
          continuation route. Its method paper remains required when it is used.
        questions: []

      maximum-entropy:
        status: resolved
        proposed:
          - publication: maxent-green-implementation-2017
            role: implementation
            when: MaxEnt is used for a diagonal Green's function or density of states
        rationale: >-
          MaxEnt is a supported GREEN capability only for diagonal Green's
          functions and densities of states.
        questions: []

  minipole:
    methods:
      scalar-minimal-pole:
        status: resolved
        proposed:
          - publication: minimal-pole-2024
            role: original-method
            when: scalar MiniPole continuation is used
          - publication: minipole-software-v0.4
            role: software
            when: MiniPole software v0.4 is used
        rationale: >-
          MiniPole has both a method paper and a versioned Zenodo software
          archive. The repository badge currently links to the v0.4 archive;
          later archived versions should use their own version DOI.
        questions: []

      matrix-minimal-pole:
        status: resolved
        proposed:
          - publication: minimal-pole-matrix-2024
            role: original-method
            when: matrix-valued MiniPole continuation is used
          - publication: minipole-software-v0.4
            role: software
            when: MiniPole software v0.4 is used
        rationale: >-
          The matrix implementation is released and fully supported. MiniPole's
          repository badge currently links to the v0.4 archive; later archived
          versions should use their own version DOI.
        questions: []

not-proposed-as-required:
  - category: general-background
    examples: [Baym-Kadanoff, Luttinger-Ward, Galitskii-Migdal, textbooks]
    reason: The website uses these to explain theory, not as an explicit usage requirement.
  - category: diagnostics-and-limitations
    examples: [multiple-self-consistent-solutions, natural-orbital-analysis]
    reason: These are relevant scientific context but not tied to a distinct user-selected method.
  - category: documented-but-not-established-as-supported
    examples: [Legendre, DLR, sparse-ir, irbasis]
    reason: The theory page discusses these representations without establishing that green-mbpt exposes each one.
